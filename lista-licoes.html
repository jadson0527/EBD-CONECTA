<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lições - EBD Conecta</title>

    <link rel="stylesheet" href="style.css">

    <script src="dados-licoes.js?v=20260922"></script>
</head>

<body>

<header>
    <h1>📖 EBD Conecta</h1>
    <p id="nomeClasse">Lições</p>
</header>

<main>

    <h2 id="tituloTrimestre">📚 3º Trimestre</h2>

    <p>
        Escolha a lição que deseja estudar.
    </p>

    <section id="listaLicoes"></section>

    <br>

    <button onclick="voltarTrimestres()">
        ← Voltar para trimestres
    </button>

</main>

<footer>
    <p>© 2026 EBD Conecta</p>
</footer>

<script>

const classe =
    localStorage.getItem("classeSelecionada");

const trimestre =
    localStorage.getItem("trimestreSelecionado") || "3";

const nomes = {

    adultos: "Lições de Adultos",

    jovens: "Lições de Jovens",

    juvenis: "Lições de Juvenis",

    adolescentes: "Lições de Adolescentes",

    "pre-adolescentes":
        "Lições de Pré-Adolescentes",

    juniores:
        "Lições de Juniores"

};

document.getElementById("nomeClasse").textContent =
    nomes[classe] || "Lições";

document.getElementById("tituloTrimestre").textContent =
    "📚 " + trimestre + "º Trimestre";

const lista =
    document.getElementById("listaLicoes");

const dadosClasse =
    licoes[classe] &&
    licoes[classe][trimestre];

if (!dadosClasse) {

    lista.innerHTML = `
        <div class="destaque">
            <h3>⚠️ Lições não encontradas</h3>
            <p>
                Não foram encontradas lições para esta classe
                e trimestre.
            </p>
        </div>
    `;

} else {

    Object.keys(dadosClasse)
        .sort((a, b) => Number(a) - Number(b))
        .forEach(function(numero) {

            const licao =
                dadosClasse[numero];

            const div =
                document.createElement("div");

            div.innerHTML = `

                <h3>
                    📖 ${licao.numero || "Lição " + numero}
                </h3>

                <p>
                    ${licao.titulo || ""}
                </p>

                <button onclick="abrirLicao('${numero}')">
                    Estudar
                </button>

                <hr>

            `;

            lista.appendChild(div);

        });

}

function abrirLicao(numero) {

    window.location.href =
        "licao.html?classe=" +
        encodeURIComponent(classe) +
        "&trimestre=" +
        encodeURIComponent(trimestre) +
        "&licao=" +
        encodeURIComponent(numero);

}

function voltarTrimestres() {

    window.location.href =
        "trimestres.html";

}

</script>

</body>
</html>
