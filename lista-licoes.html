<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lições - EBD Conecta</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <header>

        <h1>📖 EBD Conecta</h1>

        <p id="nomeClasse">
            Lições
        </p>

    </header>


    <main>

        <h2 id="tituloTrimestre">
            📚 3º Trimestre
        </h2>

        <p>
            Escolha a lição que deseja estudar.
        </p>


        <section id="listaLicoes">

        </section>


        <br>


        <button onclick="voltarTrimestres()">
            ← Voltar para trimestres
        </button>

    </main>


    <footer>

        <p>© 2026 EBD Conecta</p>

    </footer>


    <script>

        const classe =
            localStorage.getItem("classeSelecionada");

        const trimestre =
            localStorage.getItem("trimestreSelecionado");


        const nomes = {

            adultos: "Lições de Adultos",

            jovens: "Lições de Jovens",

            juvenis: "Lições de Juvenis",

            adolescentes: "Lições de Adolescentes",

            "pre-adolescentes":
                "Lições de Pré-Adolescentes",

            juniores:
                "Lições de Juniores"

        };


        document.getElementById("nomeClasse").textContent =
            nomes[classe] || "Lições";


        document.getElementById("tituloTrimestre").textContent =
            "📚 " + (trimestre || "3") + "º Trimestre";


        const lista =
            document.getElementById("listaLicoes");


        /*
         * JUVENIS
         *
         * Esta lista não depende do dados-licoes.js.
         * A Lição 11 possui uma página própria.
         */

        if (classe === "juvenis") {

            const titulosJuvenis = {

                1: "Lição 1",
                2: "Lição 2",
                3: "Lição 3",
                4: "Lição 4",
                5: "Lição 5",
                6: "Lição 6",
                7: "Lição 7",
                8: "Lição 8",
                9: "Lição 9",
                10: "Lição 10",
                11: 'Diga "Não!"',
                12: "Lição 12",
                13: "Lição 13"

            };


            for (let numero = 1; numero <= 13; numero++) {

                const div =
                    document.createElement("div");


                div.innerHTML = `

                    <h3>📖 Lição ${numero}</h3>

                    <p>
                        ${titulosJuvenis[numero]}
                    </p>

                    <button onclick="abrirLicao(${numero})">
                        Estudar
                    </button>

                    <hr>

                `;


                lista.appendChild(div);

            }


        } else {

            /*
             * As outras classes continuam usando
             * o sistema antigo.
             */

            lista.innerHTML = `
                <div class="destaque">
                    <h3>📚 Lições</h3>
                    <p>
                        O conteúdo desta classe continua no sistema
                        tradicional do EBD Conecta.
                    </p>
                </div>
            `;

        }


        function abrirLicao(numero) {

            if (classe === "juvenis") {

                if (numero === 11) {

                    window.location.href =
                        "juvenis.html?trimestre=" +
                        encodeURIComponent(trimestre || "3") +
                        "&licao=11";

                } else {

                    alert(
                        "Esta Lição ainda está sendo preparada."
                    );

                }

            } else {

                window.location.href =
                    "licao.html?classe=" +
                    encodeURIComponent(classe) +
                    "&trimestre=" +
                    encodeURIComponent(trimestre) +
                    "&licao=" +
                    encodeURIComponent(numero);

            }

        }


        function voltarTrimestres() {

            window.location.href =
                "trimestres.html";

        }

    </script>

</body>

</html>
